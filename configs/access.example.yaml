# Copy to configs/access.local.yaml (gitignored) or use env vars.
# Env vars take precedence over this file.
# Do NOT commit real keys.
api_base: "https://<university-endpoint>/v1"   # OpenAI-compatible base URL
api_key: "<key>"
models:
  extractor: "<model-id-of-gpt-oss-variant>"
  # verifier / answerer (optional, for support-check and QA ablation)
  answerer: null
timeout_s: 120
max_concurrency: 8
