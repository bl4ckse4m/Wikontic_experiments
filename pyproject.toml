[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikontic-exp"
version = "0.1.0"
description = "Research project: prompting and ensemble methods for hyper-relational fact extraction (Wikontic)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wikontic-exp = "wikontic_exp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
